# xcodegen project definition — regenerate the project with `xcodegen generate`.
# The .xcodeproj is NOT checked in; this file is the source of truth.
name: Jot
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

packages:
  JotCore:
    path: JotCore

targets:
  Jot:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: Jot
        PRODUCT_BUNDLE_IDENTIFIER: com.ammaar.jot
        # LOCAL DEVELOPMENT ONLY. Nothing signed with this leaves the machine.
        # Distribution signs MANUALLY with a personal Developer ID identity —
        # see scripts/release.sh and docs/RELEASING.md — because a personal
        # open-source app must not ship under Google LLC's Apple team.
        # Switch to 7S264298H8 (Ammaar Reshi) once that team can issue certs.
        DEVELOPMENT_TEAM: EQHXZ8M8AV
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/Jot.entitlements
        ENABLE_HARDENED_RUNTIME: NO # enabled for notarized release builds (M8)
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    sources:
      - path: App/Sources
      - path: App/Resources/Jot.icns
      # Folder references (blue folders) so bundle subdirectory structure is preserved:
      # Contents/Resources/Fonts/GoogleSansFlex/… etc.
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: App/Resources/Sounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: JotCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Jot
        CFBundleIconFile: Jot
        LSUIElement: true # menu bar app: no Dock icon
        NSMicrophoneUsageDescription: Jot records audio while you hold the dictation key, so it can transcribe what you say.
        NSHumanReadableCopyright: MIT License. Not an official Google product.
        LSMinimumSystemVersion: "14.0"
        CFBundleURLTypes:
          - CFBundleURLName: com.ammaar.jot.url
            CFBundleURLSchemes: [jot]
    scheme:
      testTargets: []
      gatherCoverageData: false
